<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Wasiyyah</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23080D1A'/><circle cx='16' cy='16' r='9' fill='none' stroke='%23D4AF5F' stroke-width='1.4'/><circle cx='19' cy='13' r='5.5' fill='%23080D1A'/></svg>">
<meta name="theme-color" content="#080D1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',system-ui,sans-serif;background:#080D1A;color:#F4EFE3;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem;overflow:hidden;position:relative}
.stars{position:fixed;inset:0;pointer-events:none}
.star-dot{position:absolute;background:#F4EFE3;border-radius:50%;animation:tw var(--dur) ease-in-out infinite}
@keyframes tw{0%,100%{opacity:var(--base)}50%{opacity:calc(var(--base)*0.15)}}
.wrap{position:relative;z-index:1;max-width:440px}
.crescent{width:64px;height:64px;margin:0 auto 2rem;opacity:.85}
.code{font-family:'Cormorant Garamond',serif;font-size:96px;font-weight:400;color:#D4AF5F;line-height:1;margin-bottom:1rem}
h1{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:500;margin-bottom:.875rem}
p{font-size:14.5px;font-weight:300;color:rgba(244,239,227,.6);line-height:1.85;margin-bottom:2rem}
a{background:#D4AF5F;color:#080D1A;padding:13px 28px;border-radius:100px;font-size:14px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:box-shadow .3s,transform .2s}
a:hover{box-shadow:0 0 30px rgba(212,175,95,.4);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="wrap">
  <svg class="crescent" viewBox="0 0 72 72" fill="none">
    <circle cx="36" cy="36" r="26" stroke="#D4AF5F" stroke-width="1.5" fill="none"/>
    <circle cx="45" cy="28" r="18" fill="#080D1A"/>
  </svg>
  <div class="code">404</div>
  <h1>This page has gone quiet.</h1>
  <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
  <a href="/index.html">Return home</a>
</div>
<script>
var f=document.getElementById('stars');
for(var i=0;i<60;i++){
  var s=document.createElement('div');
  s.className='star-dot';
  var size=Math.random()<0.85?1:2;
  s.style.width=size+'px';s.style.height=size+'px';
  s.style.left=Math.random()*100+'%';
  s.style.top=Math.random()*100+'%';
  s.style.setProperty('--base',(0.2+Math.random()*0.5).toFixed(2));
  s.style.setProperty('--dur',(3+Math.random()*4).toFixed(1)+'s');
  s.style.animationDelay=(Math.random()*4).toFixed(1)+'s';
  f.appendChild(s);
}
</script>
</body>
</html>
